# Visual-regression override — freezes the data the `ui` container serves to the
# committed fixture set so Playwright screenshots are deterministic.
#
#   docker compose -f docker-compose.yml -f docker-compose.visual.yml up -d --build ui
#
# The dev-server serves /data from the container path `/data` (ui/vite.config.ts
# `dataRoot`). We bind-mount the frozen fixture folders on top of the base
# `./data:/data` mount, replacing only `analysis/` and `songs/`.
services:
  ui:
    volumes:
      # analysis is writable (NOT :ro) so the item-10 hint-drag spec can exercise
      # the real PUT /api/human-hints save path. hint-drag.spec.ts snapshots and
      # restores the one fixture file it mutates; if a run is hard-killed, run
      # `git checkout -- tests/ui-visual/fixtures/analysis` to reset it.
      - ./tests/ui-visual/fixtures/analysis:/data/analysis
      - ./tests/ui-visual/fixtures/songs:/data/songs:ro
