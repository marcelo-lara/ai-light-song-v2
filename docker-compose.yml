services:
  # `docker compose up` starts ONLY `ui` (it has no profile). Every other
  # service carries the `ondemand` profile, so it starts only when named
  # explicitly — `docker compose run --rm app …` / `run --rm -T mcp` /
  # `run --rm test` auto-enable a service's own profile, and
  # `docker compose --profile ondemand up` brings the whole set up at once.
  # `docker compose build` still needs those services named (or
  # `--profile ondemand`) to build their images.
  app:
    profiles: ["ondemand"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-light-song-v2:dev
    working_dir: /app
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - ./data:/data
      - /home/darkangel/ai-dmx-light-render/data/songs:/data/songs
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all

  test:
    profiles: ["ondemand"]
    build:
      context: .
      dockerfile: Dockerfile.test
    image: ai-light-song-v2-test:dev
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/data
      - /home/darkangel/ai-dmx-light-render/data/songs:/data/songs
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  whisperx:
    # Own image — never the analyzer image (torch~=2.8.0 vs the app image's
    # pinned torch==2.1.2). Batch CLI tool like `app`, not a stdio server
    # like `mcp`: `docker compose run --rm whisperx --song <path>` /
    # `--all-songs` (see docs/reference/docker.md, whisperx_vad/__main__.py).
    profiles: ["ondemand"]
    build:
      context: .
      dockerfile: whisperx_vad/Dockerfile
    image: ai-light-song-v2-whisperx:dev
    working_dir: /app
    environment:
      # v3.6 item 10 (D10.1) — vocal_onsets.py's faster_whisper large-v3 reads
      # its weights from the repo's pre-fetched HF cache (bind-mounted at
      # /app via the volume below), never the network — HF_HUB_OFFLINE=1 is
      # already set in whisperx_vad/Dockerfile. Same convention as
      # experiments/acestep_transcriber/run_in_container.sh.
      - HF_HOME=/app/models/hf
    volumes:
      - .:/app
      - ./data:/data
      - /home/darkangel/ai-dmx-light-render/data/songs:/data/songs

  mcp:
    # Own image — never the analyzer image. stdio server: the MCP client spawns
    # it with `docker compose run --rm -T mcp` (see docs/mcp-definition.md).
    profiles: ["ondemand"]
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: ai-light-song-v2-mcp:dev
    working_dir: /app
    stdin_open: true
    # No tty: a TTY corrupts stdio framing (`-T` on `run` also enforces this).
    volumes:
      - .:/app:ro
      - ./data:/data:ro
    environment:
      MCP_ANALYSIS_ROOT: /data/analysis
    command: ["python", "/app/mcp/server.py"]

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: dev
    image: ai-light-song-v2-ui:dev
    working_dir: /srv/ui
    tty: true
    stdin_open: true
    volumes:
      - ./ui:/srv/ui
      - /srv/ui/node_modules
      - ./data:/data
      - /home/darkangel/ai-dmx-light-render/data/songs:/data/songs:ro
    ports:
      - "9090:8080"