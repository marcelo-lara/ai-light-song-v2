server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite build output is hashed and immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Read-only artifact tree. Song discovery parses this autoindex HTML.
    location /data/ {
        alias /data/;
        autoindex on;
        add_header Cache-Control "no-store";
    }
}
