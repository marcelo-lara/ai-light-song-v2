# Experiment queue — one table per experiment, consumed by
# experiments/run_queue.py (`./experiment`, or `./analyze --include-experiments`).
#
# Fields
#   name     required. Must equal the experiment directory name AND its UI lane
#            title (memory: lane-title-matches-experiment-name).
#   command  required. Template run once per song. Placeholders, substituted
#            per-token AFTER the command is tokenised (so a song name with
#            spaces stays one argument):
#              {song_name}     the song's dir name under the analysis root
#              {analysis_dir}   <analysis-root>/<song_name>
#              {song_path}      the source .mp3 path
#            A template may chain steps with ` && ` — each side is tokenised and
#            run as its own subprocess (no shell). Non-zero on any step fails
#            the whole row for that song.
#   image    compose service the command belongs to. D10.1: the runner executes
#            in the `app` container, so only `image = "app"` is honored here;
#            any other value is recorded skipped(needs image X ...), never run.
#   enabled  bool. A disabled row is listed skipped(disabled) and not run.
#
# Convention for the seeded rows: each experiment's run.py exposes
# `compute` then `export` subcommands keyed by `--song <name>`; `export` reads
# the cache `compute` writes. So one song = `compute && export`, regenerating
# that experiment's reference/proposals/<name>.json for the song.
#
# Adding or removing an experiment from the queue is a one-row edit here.

# phrase_periodicity and voice_multiplicity were archived, 2026-09-17 — both
# passed/validated on their own metric (phrase_periodicity's kill condition
# passed; voice_multiplicity scored AUC 0.951 on Queen of Kings) but neither
# was promoted: phrase_periodicity classifies block character, not a
# top-level field, and voice_multiplicity stayed data-starved (only one song
# in the corpus carries `voices` labels). No `src/` code references either.
# See docs/archive/experiments.discarded.phrase-periodicity.md and
# docs/archive/experiments.discarded.voice-multiplicity.md.

# vocal_voiceness (sibilance-only) and svd_tagger were archived, 2026-09-17 —
# both discarded as voiceness-presence detectors, since whisperX VAD covers
# what they were for and beats both on every song measured (frame_acc
# 0.988/0.861 vs vocal_voiceness 0.871/0.548 and svd_tagger's best rescale
# 0.854/0.513). Sibilance (`vocal_voiceness`'s one measured-strong cue) stays
# promoted in src/ as `vocals_phrase[].sibilance` — that promotion is
# untouched. See docs/archive/experiments.discarded.vocal-voiceness.md and
# docs/archive/experiments.discarded.svd-tagger.md.

# whisperx_vad was promoted OUT of experiments/ in v3.6 item 2 — it now runs
# as its own pipeline service (`docker compose run --rm whisperx --song
# <path>`), not through this queue. See
# docs/archive/experiments.promoted.whisperx-vad.md.

# rhythm_drum_ioi, rhythm_stem_autocorr, energy_level and tension_shape were
# promoted OUT of experiments/ in v3.6 item 10 — ported into
# src/analyzer/stages/section_clues.py, the analyzer's own phase-3 stage.
# rhythm_vocal_onsets was promoted the same item into whisperx_vad/
# vocal_onsets.py (D10.1), a second output of the `whisperx` service. None of
# the five run through this queue any more; their READMEs stay at
# experiments/<name>/README.md as the record of what was measured before
